# ===== 基本設定 =====

# プレフィックスキーを Ctrl+a に変更（Ctrl+bより押しやすい）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256色対応
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# マウス有効（スクロール、ペイン選択、リサイズ）
set -g mouse on

# ヒストリ上限
set -g history-limit 50000

# Escキーの遅延をなくす（vim用）
set -sg escape-time 0

# ウィンドウ番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# ===== キーバインド =====

# 設定リロード
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ペイン分割（直感的なキー）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新しいウィンドウを現在のパスで開く
bind c new-window -c "#{pane_current_path}"

# ペイン移動（vim風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+矢印でもペイン移動（プレフィックス不要）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウ切り替え
bind -n S-Left previous-window
bind -n S-Right next-window

# ===== 見た目（Tokyo Night風） =====

# ステータスバー
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 50

# 左側：セッション名
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"

# 右側：ホスト名と時刻
set -g status-right "#[fg=#bb9af7]#[bg=#bb9af7,fg=#1a1b26] #H #[bg=#7aa2f7,fg=#1a1b26] %H:%M "

# ウィンドウリスト
set -g status-justify left
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#7dcfff,bold] #I:#W "

# ペインボーダー
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

# メッセージ
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# ===== コピーモード =====

# viキーバインド
setw -g mode-keys vi

# vで選択開始、yでコピー
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# マウスでコピー時もクリップボードへ（WSL用）
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
