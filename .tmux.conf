# ===== 基本設定 =====

# プレフィックスキーを Ctrl+a に変更（Ctrl+bより押しやすい）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256色対応
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# sixel画像表示（Windows Terminal等が外側端末の場合）
# 外側端末がsixel対応であることをtmuxに伝える + パススルー許可
set -as terminal-features ",*:sixel"
set -g allow-passthrough on

# マウス有効（スクロール、ペイン選択、リサイズ）
set -g mouse on

# ヒストリ上限
set -g history-limit 50000

# Escキーの遅延をなくす（vim用）
set -sg escape-time 0

# ウィンドウ番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# ===== キーバインド =====

# 設定リロード
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ペイン分割（直感的なキー）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新しいウィンドウを現在のパスで開く
bind c new-window -c "#{pane_current_path}"

# ===== 分割・新規ウィンドウもプレフィックス不要に（Alt） =====
# いずれも現在のパスを引き継ぐ
bind -n 'M-|' split-window -h -c "#{pane_current_path}"
bind -n 'M--' split-window -v -c "#{pane_current_path}"
bind -n 'M-c' new-window -c "#{pane_current_path}"

# ペイン削除（Alt+x）。誤爆防止のため確認プロンプト付き
bind -n 'M-x' confirm-before -p "kill-pane #P? (y/n)" kill-pane

# ===== popup =====
# Alt+f : ファイルピッカー（fzf+rg）。選んだファイルを呼び出し元ペインへ送る
#   AIペイン(claude等)には @path、通常シェルにはエスケープ済みパスを送信
#   ※ display-popup はコマンド内の #{pane_id} を展開しないため、送信先はスクリプト側で特定する
bind -n M-f display-popup -E -w 80% -h 80% -d '#{pane_current_path}' \
  "~/dotfiles/scripts/tmux-file-picker.sh"

# ペイン移動（vim風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== 最速移動：Alt+hjkl（プレフィックス不要） =====
# 記事流マッピング：h/l=ウィンドウ前後、j/k=ペイン上下
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-j select-pane -D
bind -n M-k select-pane -U
# ペインの左右移動は prefix+h/l に残る（上の bind h / bind l）

# Alt+矢印でもペイン移動（4方向、プレフィックス不要）
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウ切り替え
bind -n S-Left previous-window
bind -n S-Right next-window

# ===== 見た目（Tokyo Night風） =====

# ステータスバー
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 50

# 左側：セッション名
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"

# 右側：ホスト名と時刻
set -g status-right "#[fg=#bb9af7]#[bg=#bb9af7,fg=#1a1b26] #H #[bg=#7aa2f7,fg=#1a1b26] %H:%M "

# ウィンドウリスト
set -g status-justify left
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#7dcfff,bold] #I:#W "

# ペインボーダー
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

# ペイン上部にペインID（%12 等）と実行中コマンドを表示
# Claude に「pane %12 を見て」と伝える時の参照用（不要なら off に）
set -g pane-border-status top
set -g pane-border-format " #[fg=#7dcfff]#{pane_id}#[default] #{pane_current_command} "

# メッセージ
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# ===== コピーモード =====

# viキーバインド
setw -g mode-keys vi

# OSC52でホストのクリップボードへ転送
# ネイティブLinux / WSL / SSH越し、どの環境でも同じ設定で動く（端末がOSC52対応であること）
set -s set-clipboard on
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"

# vで選択開始、yでコピー（tmuxがOSC52で端末→ホストのクリップボードへ送る）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# マウスドラッグでの選択もOSC52でコピー
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
